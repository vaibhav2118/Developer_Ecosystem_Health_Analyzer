version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecosystem_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecosystem_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecosystem_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecosystem_backend
    restart: always
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ecosystem_intel
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SECRET_KEY=super_secret_ecosystem_intelligence_key_998877
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - backend_reports:/workspace/artifacts/reports

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ecosystem_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_reports:
